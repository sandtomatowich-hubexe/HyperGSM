# HyperGSM settings. Edit from the WebUI or by hand, then run apply.sh.
# 1 = keep priority apps (and Google services when the profile is Off) out of background restrictions
NOTIF_FIX=1
PRIORITY_APPS="org.telegram.messenger org.telegram.messenger.web com.whatsapp"
# GMS battery profile: off | balanced | aggressive
GMS_PROFILE=off
# 1 = re-apply every 15 min
KEEP_APPLIED=1
CONF_VERSION=2

# HyperGSM settings. Edit from the WebUI or by hand, then run apply.sh.
# MODE: auto | cn | global (auto reads the ROM region)
MODE=auto
# 1 = keep GMS + priority apps out of background restrictions (no framework patch)
NOTIF_FIX=1
PRIORITY_APPS="org.telegram.messenger org.telegram.messenger.web com.whatsapp"
# Global battery profile: off | balanced | aggressive
GMS_PROFILE=balanced
# 1 = re-apply every 15 min
KEEP_APPLIED=1
CONF_VERSION=1
